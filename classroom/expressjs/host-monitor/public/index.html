<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-slate-950 text-white">
    <main class="min-h-screen">
      <div id="app-navbar"></div>

      <section
        class="mx-auto grid min-h-[calc(100vh-84px)] max-w-7xl items-center gap-10 px-4 pb-12 pt-6 sm:px-6 lg:grid-cols-[0.9fr_1.1fr] lg:px-8"
      >
        <div>
          <p
            class="text-sm font-semibold uppercase tracking-[0.28em] text-cyan-300"
          >
            Monitoramento de hosts
          </p>
          <h1
            class="mt-5 max-w-3xl text-5xl font-bold tracking-tight sm:text-6xl"
          >
            Host Monitor
          </h1>
          <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-300">
            Acompanhe disponibilidade, latência e histórico dos seus hosts em um
            painel direto para operação.
          </p>
          <div class="mt-8 flex flex-wrap gap-3">
            <a
              href="/login.html"
              class="rounded-xl bg-cyan-300 px-5 py-3 text-sm font-bold text-slate-950 transition hover:bg-cyan-200"
              >Entrar</a
            >
            <a
              href="/register.html"
              class="rounded-xl border border-white/20 px-5 py-3 text-sm font-bold text-white transition hover:bg-white/10"
              >Criar conta</a
            >
          </div>
        </div>

        <div
          class="overflow-hidden rounded-2xl border border-white/10 bg-slate-900 shadow-2xl shadow-cyan-950/40"
        >
          <div
            class="flex items-center justify-between border-b border-white/10 px-4 py-3"
          >
            <div class="flex gap-2">
              <span class="h-3 w-3 rounded-full bg-rose-400"></span>
              <span class="h-3 w-3 rounded-full bg-amber-300"></span>
              <span class="h-3 w-3 rounded-full bg-emerald-400"></span>
            </div>
            <span class="text-xs font-semibold text-slate-400"
              >dashboard.html</span
            >
          </div>
          <div class="grid gap-4 p-5 sm:grid-cols-3">
            <article
              class="rounded-xl border border-emerald-400/30 bg-emerald-400/10 p-4"
            >
              <p
                class="text-xs font-semibold uppercase tracking-[0.18em] text-emerald-200"
              >
                Online
              </p>
              <p class="mt-3 text-3xl font-bold">98.5%</p>
              <div class="mt-4 h-2 rounded-full bg-white/10">
                <div class="h-2 w-[98%] rounded-full bg-emerald-400"></div>
              </div>
            </article>
            <article
              class="rounded-xl border border-cyan-400/30 bg-cyan-400/10 p-4"
            >
              <p
                class="text-xs font-semibold uppercase tracking-[0.18em] text-cyan-200"
              >
                Latência
              </p>
              <p class="mt-3 text-3xl font-bold">12ms</p>
              <div class="mt-4 flex h-10 items-end gap-1">
                <span class="h-4 flex-1 rounded bg-cyan-300"></span>
                <span class="h-7 flex-1 rounded bg-cyan-300"></span>
                <span class="h-5 flex-1 rounded bg-cyan-300"></span>
                <span class="h-9 flex-1 rounded bg-cyan-300"></span>
                <span class="h-6 flex-1 rounded bg-cyan-300"></span>
              </div>
            </article>
            <article
              class="rounded-xl border border-rose-400/30 bg-rose-400/10 p-4"
            >
              <p
                class="text-xs font-semibold uppercase tracking-[0.18em] text-rose-200"
              >
                Alertas
              </p>
              <p class="mt-3 text-3xl font-bold">1</p>
              <div class="mt-4 h-2 rounded-full bg-white/10">
                <div class="h-2 w-[20%] rounded-full bg-rose-400"></div>
              </div>
            </article>
          </div>
          <div class="border-t border-white/10 p-5">
            <div class="grid gap-3">
              <div
                class="flex items-center justify-between rounded-xl bg-white/5 px-4 py-3"
              >
                <div>
                  <p class="font-semibold">Google DNS</p>
                  <p class="text-sm text-slate-400">8.8.8.8</p>
                </div>
                <span
                  class="rounded-full bg-emerald-400/20 px-3 py-1 text-xs font-bold text-emerald-200"
                  >Online</span
                >
              </div>
              <div
                class="flex items-center justify-between rounded-xl bg-white/5 px-4 py-3"
              >
                <div>
                  <p class="font-semibold">Servidor interno</p>
                  <p class="text-sm text-slate-400">intranet.local</p>
                </div>
                <span
                  class="rounded-full bg-rose-400/20 px-3 py-1 text-xs font-bold text-rose-200"
                  >Offline</span
                >
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/session.js"></script>
    <script type="module">
      HostMonitorNavbar.renderNavbar({ theme: 'dark' });
      HostMonitorSession.redirectIfAuthenticated();
    </script>
  </body>
</html>
